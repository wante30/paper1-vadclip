name: build-paper-ai-preview
on:
  push:
    branches: [fig1-ai-preview]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-fig1-ai-preview
          path: paper/main.pdf
